<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f12;
      --surface:   #151820;
      --border:    #252b36;
      --accent:    #e8ff6e;
      --accent2:   #6ef0ff;
      --muted:     #4a5568;
      --text:      #e2e8f0;
      --text-dim:  #718096;
      --user-bg:   #1e2533;
      --bot-bg:    #131820;
      --radius:    12px;
      --mono:      'DM Mono', monospace;
      --sans:      'DM Sans', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── Layout ── */
    .app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      max-width: 760px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      animation: fadeDown 0.4s ease both;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--accent);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .logo svg { width: 20px; height: 20px; }

    .header-text h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .header-text p {
      font-size: 12px;
      color: var(--text-dim);
      font-family: var(--mono);
    }

    .mode-toggle {
      margin-left: auto;
      display: flex;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
    }

    .mode-btn {
      font-family: var(--mono);
      font-size: 11px;
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: transparent;
      color: var(--text-dim);
      transition: all 0.15s;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #0d0f12;
      font-weight: 500;
    }

    /* ── Messages ── */
    .messages {
      overflow-y: auto;
      padding: 24px 24px 8px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0.5;
      user-select: none;
      animation: fadeIn 0.6s ease both 0.2s;
    }

    .empty-state .big-icon {
      font-size: 48px;
      filter: grayscale(0.3);
    }

    .empty-state p {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text-dim);
      text-align: center;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 4px;
    }

    .suggestion {
      font-family: var(--mono);
      font-size: 11px;
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      cursor: pointer;
      color: var(--text-dim);
      background: var(--surface);
      transition: all 0.15s;
    }

    .suggestion:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* message rows */
    .msg {
      display: flex;
      gap: 12px;
      animation: fadeUp 0.25s ease both;
    }

    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 600;
    }

    .msg.user   .avatar { background: var(--accent); color: #0d0f12; }
    .msg.claude .avatar { background: var(--accent2); color: #0d0f12; }

    .bubble {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14.5px;
      line-height: 1.65;
      position: relative;
    }

    .msg.user   .bubble { background: var(--user-bg); border: 1px solid var(--border); border-top-right-radius: 3px; }
    .msg.claude .bubble { background: var(--bot-bg);  border: 1px solid var(--border); border-top-left-radius: 3px; }

    .meta {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      margin-top: 6px;
      display: flex;
      gap: 10px;
    }

    .meta span { display: flex; align-items: center; gap: 3px; }

    /* typing indicator */
    .typing .bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 18px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent2);
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    /* tool badge */
    .tool-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mono);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(110, 240, 255, 0.1);
      border: 1px solid rgba(110, 240, 255, 0.25);
      color: var(--accent2);
      margin-bottom: 8px;
    }

    /* ── Input area ── */
    .input-area {
      padding: 16px 24px 24px;
      border-top: 1px solid var(--border);
      animation: fadeUp 0.4s ease both 0.1s;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 10px 10px 16px;
      transition: border-color 0.15s;
    }

    .input-row:focus-within { border-color: var(--accent); }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--sans);
      font-size: 14.5px;
      resize: none;
      line-height: 1.5;
      max-height: 120px;
      min-height: 24px;
    }

    textarea::placeholder { color: var(--muted); }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #0d0f12;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .send-btn:hover:not(:disabled) { background: #f0ff90; transform: scale(1.05); }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .input-hint {
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }

    /* ── Animations ── */
    @keyframes fadeUp   { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:none } }
    @keyframes fadeDown { from { opacity:0; transform:translateY(-8px)} to { opacity:1; transform:none } }
    @keyframes fadeIn   { from { opacity:0 } to { opacity:1 } }
    @keyframes bounce   {
      0%,80%,100% { transform: translateY(0) }
      40%         { transform: translateY(-6px) }
    }

    /* ── Error ── */
    .error-bubble {
      font-family: var(--mono);
      font-size: 12px;
      color: #ff6e6e;
      background: rgba(255,110,110,0.08);
      border: 1px solid rgba(255,110,110,0.2);
      border-radius: 8px;
      padding: 10px 14px;
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0d0f12" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Claude Agent</h1>
      <p>localhost:8000 · FastAPI</p>
    </div>
    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="chat" onclick="setMode('chat')">chat</button>
      <button class="mode-btn" data-mode="weather" onclick="setMode('weather')">weather 🌤</button>
    </div>
  </header>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="empty-state" id="empty">
      <div class="big-icon">⚡</div>
      <p>Your agent is ready.<br/>Ask anything below.</p>
      <div class="suggestions">
        <span class="suggestion" onclick="sendSuggestion(this)">Tell me a fun fact</span>
        <span class="suggestion" onclick="sendSuggestion(this)">Weather in Tokyo?</span>
        <span class="suggestion" onclick="sendSuggestion(this)">Explain async/await</span>
        <span class="suggestion" onclick="sendSuggestion(this)">Write me a haiku</span>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <textarea
        id="input"
        placeholder="Message Claude…"
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="input-hint">
      <span>⏎ send &nbsp;·&nbsp; shift+⏎ newline</span>
      <span id="modeLabel">mode: <b>chat</b></span>
    </div>
  </div>

</div>

<script>
  // ── Config ────────────────────────────────────────────────────────────────
  // Change this to your Render URL once deployed, e.g.:
  // const API_BASE = "https://claude-agent.onrender.com";
  const API_BASE = "http://localhost:8000";

  let currentMode = "chat";   // "chat" or "weather"

  // ── Mode toggle ──────────────────────────────────────────────────────────
  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll(".mode-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.mode === mode);
    });
    document.getElementById("modeLabel").innerHTML =
      `mode: <b>${mode === "weather" ? "weather agent 🌤" : "chat"}</b>`;
  }

  // ── Textarea auto-resize ─────────────────────────────────────────────────
  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 120) + "px";
  }

  // ── Keyboard shortcut ────────────────────────────────────────────────────
  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  // ── Suggestion chips ─────────────────────────────────────────────────────
  function sendSuggestion(el) {
    const text = el.textContent;
    // auto-switch to weather mode for weather suggestions
    if (text.toLowerCase().includes("weather")) setMode("weather");
    document.getElementById("input").value = text;
    sendMessage();
  }

  // ── Render helpers ────────────────────────────────────────────────────────
  function hideEmpty() {
    const el = document.getElementById("empty");
    if (el) el.remove();
  }

  function appendMessage(role, text, meta = null, usedTool = false) {
    hideEmpty();
    const box  = document.getElementById("messages");
    const wrap = document.createElement("div");
    wrap.className = `msg ${role}`;

    const initial = role === "user" ? "U" : "AI";
    const toolHTML = usedTool
      ? `<div class="tool-badge">⚡ tool: get_weather</div>`
      : "";
    const metaHTML = meta
      ? `<div class="meta">
           <span>🪙 in: ${meta.input_tokens}</span>
           <span>🪙 out: ${meta.output_tokens}</span>
           <span>📦 ${meta.model.split("-").slice(1,3).join("-")}</span>
         </div>`
      : "";

    wrap.innerHTML = `
      <div class="avatar">${initial}</div>
      <div>
        <div class="bubble">${toolHTML}${escapeHtml(text)}</div>
        ${metaHTML}
      </div>`;

    box.appendChild(wrap);
    box.scrollTop = box.scrollHeight;
    return wrap;
  }

  function appendTyping() {
    hideEmpty();
    const box  = document.getElementById("messages");
    const wrap = document.createElement("div");
    wrap.className = "msg claude typing";
    wrap.id = "typing";
    wrap.innerHTML = `
      <div class="avatar">AI</div>
      <div class="bubble">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>`;
    box.appendChild(wrap);
    box.scrollTop = box.scrollHeight;
  }

  function removeTyping() {
    document.getElementById("typing")?.remove();
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/\n/g,"<br/>");
  }

  // ── Main send ─────────────────────────────────────────────────────────────
  async function sendMessage() {
    const input = document.getElementById("input");
    const btn   = document.getElementById("sendBtn");
    const text  = input.value.trim();
    if (!text) return;

    // render user bubble
    appendMessage("user", text);
    input.value = "";
    input.style.height = "auto";
    btn.disabled = true;

    // show typing dots
    appendTyping();

    const endpoint = currentMode === "weather" ? "/chat/weather" : "/chat";

    try {
      const res = await fetch(`${API_BASE}${endpoint}`, {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ message: text }),
      });

      removeTyping();

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        appendError(err.detail || "Something went wrong");
      } else {
        const data = await res.json();
        appendMessage(
          "claude",
          data.reply,
          { input_tokens: data.input_tokens, output_tokens: data.output_tokens, model: data.model },
          currentMode === "weather"
        );
      }
    } catch (err) {
      removeTyping();
      appendError(`Cannot reach ${API_BASE} — is your FastAPI server running?`);
    }

    btn.disabled = false;
    input.focus();
  }

  function appendError(msg) {
    hideEmpty();
    const box  = document.getElementById("messages");
    const wrap = document.createElement("div");
    wrap.innerHTML = `<div class="error-bubble">⚠ ${escapeHtml(msg)}</div>`;
    box.appendChild(wrap);
    box.scrollTop = box.scrollHeight;
  }
</script>
</body>
</html>
